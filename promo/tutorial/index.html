<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ServerIsland 使用教程</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; }
  canvas { display: block; }
  body.preview #stage { transform-origin: 0 0; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #8aa; font: 12px system-ui; }

</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<img id="logo" src="../../Branding/logo-1024.png" style="display:none">
<script src="script.js"></script>
<script src="timing.js"></script>
<script src="timing-en.js"></script>

<script>
"use strict";
// =====================================================================================
// ServerIsland 使用教程（中文、横屏、约 3 分钟）。画面是时间 t（秒）的纯函数 renderFrame(t)。
// 每一章的动画都以 timing.js 里"某句旁白开始的时刻"为锚点：S("a3") + 0.4 表示第 a3 句开始后 0.4 秒。
// =====================================================================================
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
// 英文版用自己的时间轴（英文配音的时长不同）：audio.py --en 生成 timing-en.js
const TM = EN ? window.TIMING_EN : window.TIMING, SCR = window.SCRIPT;
const S = id => TM.lines[id].start;
const CH = id => TM.chapters.find(c => c.id === id);

// ------------------------------------------------------------------ 演示数据（与 DemoData.swift 同一套虚构信息）
function hpcCard(o = {}) {
  const t = o.t || 0, done = o.done ?? 14;
  const jobs = [
    { icon: "atom", col: COL.mint, name: "aimd_Li3PS4_900K", id: "#8812044", right: T("25% · 约剩 1d", "25% · ~1d"), rightCol: COL.mint, detail: T("VASP MD · 1,243/5,000 步", "VASP MD · 1,243/5,000 steps"), k: 0.25 },
    { icon: "atom", col: COL.mint, name: "relax_LiCoO2_hse", id: "#8812101", right: "3:12:16 / 1d 00:00", detail: T("VASP 结构优化 · 17 离子步", "VASP relaxation · 17 ionic steps"), k: 0.13, fill: "time" },
    { icon: "stack", col: COL.mint, name: "eos_scan", id: T("数组 #8812300", "array #8812300"), idCol: COL.violet, right: T(`完成 ${done + 2}/40`, `${done + 2}/40 done`), rightCol: COL.mint,
      seg: [done / 40, 2 / 40, 6 / 40], segText: [[T("运行 6", "6 running"), COL.cyan], [T(`排队 ${32 - done}`, `${32 - done} pending`), COL.sec], [T("失败 2", "2 failed"), COL.coral]] },
    { icon: "atom", col: COL.mint, name: "gpumd_kappa_300K", id: "#8812230", right: T("62% · 约剩 8m", "62% · ~8m"), rightCol: COL.mint, detail: T("GPUMD 模拟 · 1.25M/2.00M 步 · 1,520 步/秒", "GPUMD MD · 1.25M/2.00M steps · 1,520 steps/s"), k: 0.62 },
    { icon: "hourglass", col: COL.amber, name: "phonon_Si_444", id: "#8812355", right: T("上限 12:00:00", "limit 12:00:00"), pending: T("优先级排队中 · cpu", "Queued by priority · cpu") },
    { icon: "hourglass", col: COL.amber, name: "band_LiCoO2", id: "#8812356", right: T("上限 6:00:00", "limit 6:00:00"), pending: T("依赖永远无法满足 · cpu", "Dependency never satisfied · cpu"), warn: true },
  ];
  const pick = o.jobs || [0, 1, 2, 3, 4];
  return { name: T("HPC 集群", "HPC Cluster"), kind: "SLURM", run: 9, pend: 20, metrics: [["CPU", 0.29, "29%"], [T("内存", "MEM"), 0.39, "92.8/238G"]],
    jobs: pick.map(i => Object.assign({}, jobs[i])), more: o.more === false ? null : (o.more || T("还有 1 个任务，查看全部 ›", "1 more — show all ›")), muted: o.muted, paused: o.paused, banner: o.banner };
}
function gpuCard(o = {}) {
  const jobs = [
    { icon: "atom", col: COL.mint, name: "nep", id: "pid 41022", right: T("39% · 约剩 7m", "39% · ~7m"), rightCol: COL.mint, detail: T("NEP 训练 · 7,860/20,000 代 · Total 0.1815", "NEP training · 7,860/20,000 gen · Total 0.1815"), k: 0.39 },
    { icon: "atom", col: COL.mint, name: "lmp", id: "pid 41377", right: T("39% · 约剩 12m", "39% · ~12m"), rightCol: COL.mint, detail: T("LAMMPS MD · 386,000/1.00M 步 · 830 步/秒", "LAMMPS MD · 386,000/1.00M steps · 830 steps/s"), k: 0.386 },
    { icon: "atom", col: COL.mint, name: "python train_mace.py", id: "pid 41856", right: "19%", rightCol: COL.mint, detail: T("MACE 训练 · 37/200 epoch", "MACE training · 37/200 epoch"), k: 0.19 },
  ];
  return { name: T("4090 工作站", "4090 Workstation"), kind: "DIRECT", run: 3, metrics: [["CPU", 0.58, "58%"], [T("内存", "MEM"), 0.56, "66.8/119G"], ["GPU", 0, T("1/4 空闲", "1/4 idle")]],
    gpus: [0.92, 0.84, 0.97, 0], jobs: (o.jobs || [0, 1, 2]).map(i => Object.assign({}, jobs[i])) };
}
function pbsCard() {
  return { name: T("超算中心", "Supercomputing Center"), kind: "PBS", run: 2, pend: 1, metrics: [["CPU", 0.22, "22%"], [T("内存", "MEM"), 0.24, "61/250G"]],
    jobs: [
      { icon: "atom", col: COL.mint, name: "md_water_512", id: "#4471203", right: T("41% · 约剩 3h", "41% · ~3h"), rightCol: COL.mint, detail: T("LAMMPS MD · 410,000/1.00M 步", "LAMMPS MD · 410,000/1.00M steps"), k: 0.41 },
      { icon: "stack", col: COL.mint, name: "opt_scan", id: T("数组 #4471250", "array #4471250"), idCol: COL.violet, right: T("完成 8/20", "8/20 done"), rightCol: COL.mint, seg: [8 / 20, 0, 4 / 20], segText: [[T("运行 4", "4 running"), COL.cyan], [T("排队 8", "8 pending"), COL.sec]] },
      { icon: "hourglass", col: COL.amber, name: "neb_AuCu", id: "#4471266", right: T("上限 24:00:00", "limit 24:00:00"), pending: T("等待资源 · workq", "Waiting for resources · workq") },
    ] };
}
const IDLE = [T("老服务器", "Old Server"), T("3090 工作站", "3090 Workstation")];
const PANEL_W = 668;
// 面板内容区：ear 14 + 内边距 14
const CARD_X = MID - PANEL_W / 2 + 28, CARD_W = PANEL_W - 56;
function panelH(cards, idle) {
  let h = MENU + 8 + cards.reduce((a, cd) => a + cardHeight(cd), 0) + 8 * (cards.length - 1) + 14;
  if (idle) h += 8 + 36;
  return h;
}
// 画面板（标题 + 卡片 + 空闲行）；会把每张卡片的位置记在 card._y 上，光标和高亮用
function panelBody(c, x, w, t, cards, o = {}) {
  islandHeader(c, x + 14, w - 28, t, o.header);
  let y = MENU + 8;
  cards.forEach((cd, i) => {
    const ki = o.since != null ? easeOutCubic(clamp((o.since - 0.1 - i * 0.12) * 4)) : 1;
    c.save(); c.globalAlpha *= ki; c.translate(0, 14 * (1 - ki));
    cd._y = y; drawCard(c, x + 14, y, w - 28, cd, t);
    c.restore();
    y += cardHeight(cd) + 8;
  });
  if (o.idle) { o._idleY = y; drawIdleRow(c, x + 14, y, w - 28, o.idle); }
}
// 页面切换：from / to 两个画法在 [t0, t0+0.35] 内左右滑动交替
function slidePages(c, t, t0, drawA, drawB, dir = 1) {
  const k = pr(t, t0, t0 + 0.35, easeInOutCubic);
  if (k < 1) { c.save(); c.globalAlpha *= 1 - k; c.translate(-50 * k * dir, 0); drawA(); c.restore(); }
  if (k > 0) { c.save(); c.globalAlpha *= k; c.translate(50 * (1 - k) * dir, 0); drawB(); c.restore(); }
}

// Mac 场景：桌面 + 刘海 + 世界坐标里的额外内容
function macScene(c, t, cam, keys, content, o = {}) {
  withCamera(c, cam, () => {
    drawLaptop(c);
    drawDesktop(c, t, { below: o.below, app: o.app, menus: o.menus });
    const s = islandSpec(t, keys);
    drawIsland(c, s, (x, w) => content && content(x, w, s));
    if (o.above) o.above(s);
  });
}
// 刘海内容的通用分派：collapsed → 两翼；toast → 提示；其余交给 fn
function islandContent(t, o) {
  return (x, w, s) => {
    if (s.name === "collapsed") { ctx2(s, () => drawWings(cur, t, o.wings ? o.wings(t) : {})); return; }
    if (s.name === "toast") { drawToast(cur, x, w, t, Object.assign(o.toast(t), { since: s.since })); return; }
    if (s.name === "hidden") return;
    const a = clamp((s.since - 0.06) * 4);
    cur.save(); cur.globalAlpha *= (o.instant ? 1 : a); o.panel(x, w, s); cur.restore();
  };
}
let cur = ctx;
function ctx2(s, fn) { cur.save(); cur.globalAlpha *= clamp(s.since * 4 + (s.since > 5 ? 1 : 0)); fn(); cur.restore(); }

// =====================================================================================
// 0. 开场：先看灵动岛本身——收起的两翼、完成提示叮咚、悬停展开；然后是标题
// =====================================================================================
function sceneHook(c, t) {
  const h1 = S("h1"), h2 = S("h2"), h3 = S("h3"), h4 = S("h4");
  const cards = [hpcCard({ jobs: [0, 1, 2, 3, 4] }), gpuCard()];
  const PH = panelH(cards);
  const cam = camKeys(t, [[0, { x: MID, y: SH / 2 + 30, z: 0.98 }], [h1 - 0.3, { x: MID, y: SH / 2 + 30, z: 0.98 }], [h1 + 1.6, { x: MID, y: 105, z: 2.9 }],
    [h3 + 0.4, { x: MID, y: 105, z: 2.9 }], [h3 + 1.5, { x: MID, y: 318, z: 1.56 }]]);
  const keys = [[0, "collapsed"], [h2 - 0.15, "toast"], [h3 + 0.05, "collapsed"], [h3 + 0.55, panelSpec(PH)]];
  macScene(c, t, cam, keys, islandContent(t, {
    wings: t => ({ mood: t > h2 && t < h3 + 0.6 ? "happy" : "working", k: t > h2 ? 0.62 : 0.97, run: t > h2 ? 12 : 13 }),
    toast: () => ({ ok: true, host: T("4090 工作站", "4090 Workstation"), title: T("NEP 训练完成", "NEP training finished"), sub: T("20,000 代 · nep-train", "20,000 gen · nep-train") }),
    panel: (x, w, s) => panelBody(c, x, w, t, cards, { since: s.since }),
  }), {
    above: () => {
      burst(c, t, h2 + 0.05, MID - 160, MENU + 40, { n: 30, speed: 140, size: 4, grav: 80, seed: 3, dur: 1.2 });
      if (t > h3 - 0.2) {
        const [cx, cy] = cursorAt(t, [[h3 - 0.2, MID + 300, 260], [h3 + 0.45, MID + 50, 14], [h3 + 1.4, MID + 50, 14], [h3 + 2.6, MID + 200, 240]]);
        drawCursor(c, cx, cy, 0.85);
      }
    }
  });
  // 标题卡
  const kt = pr(t, h4 - 0.4, h4 + 0.3, easeOutCubic);
  if (kt > 0) {
    c.fillStyle = `rgba(6,9,22,${0.84 * kt})`; c.fillRect(0, 0, W, H);
    c.save(); c.globalAlpha *= kt;
    const k = easeOutBack(pr(t, h4 - 0.3, h4 + 0.4), 1.4);
    if (LOGO.complete) { c.save(); c.shadowColor = "rgba(91,230,181,0.5)"; c.shadowBlur = 60; const sz = 190 * k; c.drawImage(LOGO, W / 2 - sz / 2, 250 - sz / 2, sz, sz); c.restore(); }
    text(c, T("ServerIsland 使用教程", "ServerIsland Tutorial"), W / 2, 470, { size: 74, weight: 700, align: "center" });
    c.globalAlpha *= pr(t, h4, h4 + 0.5);
    text(c, T("从添加服务器到每一项功能 · v0.3.0", "From adding a server to every feature · v0.3.0"), W / 2, 540, { size: 30, color: "rgba(255,255,255,0.7)", align: "center" });
    c.restore();
    const chs = TM.chapters.filter(ch => ch.title);
    chs.forEach((ch, i) => {
      const ki = easeOutBack(pr(t, h4 + 0.3 + i * 0.14, h4 + 0.65 + i * 0.14), 1.8);
      if (ki <= 0) return;
      const cw = 360, gx = W / 2 - (cw * 4 + 24 * 3) / 2, x = gx + (i % 4) * (cw + 24), y = 630 + Math.floor(i / 4) * 92;
      c.save(); c.globalAlpha *= clamp(ki) * kt; c.translate(x + cw / 2, y + 34); c.scale(ki, ki);
      c.fillStyle = "rgba(255,255,255,0.07)"; rr(c, -cw / 2, -34, cw, 68, 18); c.fill();
      c.strokeStyle = "rgba(255,255,255,0.10)"; c.lineWidth = 1.5; rr(c, -cw / 2, -34, cw, 68, 18); c.stroke();
      text(c, String(i + 1).padStart(2, "0"), -cw / 2 + 26, 10, { size: 26, weight: 700, color: COL.mint, font: MONO });
      text(c, ch.title, -cw / 2 + 80, 10, { size: 27, weight: 600 });
      c.restore();
    });
  }
}

// =====================================================================================
// 设置窗口（世界坐标里的一扇窗）
// =====================================================================================
const WX = 346, WY = 140, WW = 820, WH = 560, SIDE = 220, MAINX = WX + SIDE + 26, MAINW = WW - SIDE - 52;
const CAM_WIN = { x: 756, y: 420, z: 1.5 };
const SRV = {
  hpc: { title: T("HPC 集群", "HPC Cluster"), sub: T("运行 9 · 排队 20", "9 running · 20 pending"), col: "#D45BE8", icon: "stack", dot: COL.mint },
  gpu: { title: T("4090 工作站", "4090 Workstation"), sub: T("运行 3 · 排队 0", "3 running · 0 pending"), col: "#35C7C2", icon: "server", dot: COL.mint },
  jump: { title: T("校园网跳板机", "Campus Gateway"), sub: T("跳板机 · 已停用", "Jump host · disabled"), col: "#F2A33A", icon: "key" },
  lab: { title: T("实验室集群", "Lab Cluster"), sub: T("未登录", "Not logged in"), col: "#4C8DFF", icon: "stack", dot: COL.amber },
};
// 侧栏：order = 服务器顺序；pos(i) 可以是小数（排序动画）；sel = 选中项的 id
function sidebar(c, t, o) {
  const x = WX;
  const top = WY + 48;
  sideItem(c, x, top, SIDE, { title: T("通用", "General"), sub: T("轮询、提醒、提示音", "Refresh, alerts, sounds"), col: "#8E8E93", icon: "gear" }, o.sel === "general");
  sideItem(c, x, top + 46, SIDE, { title: T("进度识别", "Progress Detection"), sub: T("内置软件、自定义规则", "Built-in apps, custom rules"), col: "#7B61FF", icon: "wand" }, o.sel === "rules");
  text(c, T("服务器", "Servers"), x + 18, top + 118, { size: 11, weight: 600, color: SET.sec });
  const rowY = i => top + 128 + i * 46;
  const ys = {};
  o.order.forEach((id, i) => {
    const p = o.pos ? o.pos(id, i) : i;
    ys[id] = rowY(p);
  });
  // 被拖动的那一项最后画，带阴影
  const drawRow = id => {
    const it = Object.assign({}, SRV[id], o.over && o.over[id]);
    const y = o.drag && o.drag.id === id ? o.drag.y : ys[id];
    if (o.drag && o.drag.id === id) { c.save(); c.shadowColor = "rgba(0,0,0,0.5)"; c.shadowBlur = 16; c.fillStyle = "#3A3A3D"; rr(c, x + 8, y, SIDE - 16, 40, 8); c.fill(); c.restore(); }
    sideItem(c, x, y, SIDE, it, o.sel === id ? true : o.ctx === id ? "rgba(61,139,255,0.35)" : false);
  };
  o.order.filter(id => !(o.drag && o.drag.id === id)).forEach(drawRow);
  if (o.drag) drawRow(o.drag.id);
  text(c, T("拖动或右键可调整顺序", "Drag or right-click to reorder"), x + 18, rowY(o.order.length) + 14, { size: 10.5, color: "rgba(255,255,255,0.32)" });
  // 底部
  const by = WY + WH - 70;
  c.fillStyle = o.addPress ? "rgba(255,255,255,0.24)" : "rgba(255,255,255,0.13)"; rr(c, x + 14, by, SIDE - 28, 28, 7); c.fill();
  icon(c, "plus", x + SIDE / 2 - 44, by + 14, 14, "#fff", { inner: "#555" });
  text(c, T("添加服务器", "Add Server"), x + SIDE / 2 + 8, by + 18.5, { size: 13, weight: 500, align: "center" });
  icon(c, "power", x + SIDE / 2 - 62, by + 46, 12, SET.sec);
  text(c, T("退出 ServerIsland", "Quit ServerIsland"), x + SIDE / 2 + 6, by + 50, { size: 12, color: SET.sec, align: "center" });
  return { rowY, ys, add: [x + SIDE / 2, by + 14] };
}
function sectionTitle(c, x, y, title, col, ic) {
  c.fillStyle = col; rr(c, x, y - 15, 22, 22, 6); c.fill();
  icon(c, ic, x + 11, y - 4, 13, "#fff");
  text(c, title, x + 30, y + 1, { size: 14, weight: 700, color: SET.text });
}
// 通用页（顶部的 App 信息 + 更新行 + 轮询）
function generalPage(c, t, o = {}) {
  const x = MAINX, w = MAINW;
  let y = WY + 48;
  const uh = o.updateH || 44;
  const gh = 78 + 36 + uh + 36;
  c.fillStyle = SET.group; rr(c, x, y, w, gh, 10); c.fill();
  c.strokeStyle = "rgba(255,255,255,0.06)"; c.lineWidth = 0.8; rr(c, x, y, w, gh, 10); c.stroke();
  if (LOGO.complete) c.drawImage(LOGO, x + 12, y + 10, 58, 58);
  text(c, "ServerIsland", x + 82, y + 32, { size: 20, weight: 700, color: SET.text });
  text(c, T("版本 ", "Version ") + (o.version || "0.3.0"), x + 82, y + 50, { size: 11.5, color: SET.sec });
  text(c, T("4 台服务器 · 运行 12 · 排队 20", "4 servers · 12 running · 20 pending"), x + 82, y + 67, { size: 12, color: SET.sec });
  drawTako(c, x + w - 40, y + 60, 40, o.mood || "idle", Math.floor(t * 4), { shadow: false });
  const rows = [
    { label: T("语言", "Language"), kind: "popup", value: T("中文", "English") },
    { custom: o.updateRow || ((rx, ry, rw, rh) => { icon(c, "check", rx + 22, ry + rh / 2, 13, COL.mint); text(c, T("已是最新版本（0.3.0）", "You're up to date (0.3.0)"), rx + 38, ry + rh / 2 + 4.5, { size: 13, color: SET.text }); button(c, rx + rw - 12, ry + rh / 2, T("检查更新", "Check for Updates"), { align: "right" }); }), h: uh },
    { label: T("自动检查更新", "Check for Updates Automatically"), help: true, kind: "toggle", value: true },
  ];
  c.fillStyle = SET.line; c.fillRect(x + 12, y + 78, w - 24, 1);
  formGroup(c, x, y + 78, w, rows, t, { bare: true });
  y += gh + 30;
  sectionTitle(c, x, y, T("轮询", "Refresh"), "#2F8CFF", "refresh");
  y += 16;
  formGroup(c, x, y, w, [{ label: T("自动刷新", "Auto Refresh"), help: true, kind: "toggle", value: true }, { label: T("默认轮询间隔", "Default Interval"), kind: "popup", value: T("1 分钟", "1 min") }], t);
  y += 72 + 30;
  sectionTitle(c, x, y, T("刘海与提醒", "Island & Alerts"), "#FF9F0A", "bell");
  y += 16;
  formGroup(c, x, y, w, [{ label: T("收起时", "When Collapsed"), kind: "popup", value: T("始终显示", "Always") }, { label: T("提示音", "Sounds"), help: true, kind: "toggle", value: true }], t);
}
// =====================================================================================
// 1. 添加服务器
// =====================================================================================
const SHX = WX + (WW - 500) / 2, SHY = WY + 6, SHW = 500, SHH = 520;
function addSheet(c, t, st) {
  // st: {tab, cfgPick, fields, auth, authMenu, jump, jumpMenu, press}
  c.save();
  c.shadowColor = "rgba(0,0,0,0.5)"; c.shadowBlur = 30; c.shadowOffsetY = 10;
  c.fillStyle = "#303032"; rr(c, SHX, SHY, SHW, SHH, 12); c.fill();
  c.restore();
  c.strokeStyle = "rgba(255,255,255,0.12)"; c.lineWidth = 1; rr(c, SHX, SHY, SHW, SHH, 12); c.stroke();
  const x = SHX + 20, w = SHW - 40;
  text(c, T("添加服务器", "Add Server"), x, SHY + 36, { size: 17, weight: 700, color: SET.text });
  const tabs = segment(c, x, SHY + 66, [T("从 ~/.ssh/config 选择", "From ~/.ssh/config"), T("手动填写", "Enter Manually")], st.tab, { width: w });
  const L = { tabs };
  if (st.tab < 0.5) {
    text(c, T("从 ~/.ssh/config 中选择。连接使用系统 ssh，跳板机、密钥等配置都会生效。", "Pick from ~/.ssh/config. Connections use the system ssh, so ProxyJump, keys, etc. all apply."), x, SHY + 104, { size: 11.5, color: SET.sec });
    const ly = SHY + 116;
    c.fillStyle = "rgba(0,0,0,0.25)"; rr(c, x, ly, w, 176, 8); c.fill();
    const entries = [["hpc-login", "demo@login.hpc.example.org", true], ["gpu-box", "demo@10.0.0.12", true], ["cluster-b", T("demo@cluster-b.example.edu · 端口 2222", "demo@cluster-b.example.edu · port 2222"), false], ["lab-gateway", "demo@gw.example.edu", false]];
    L.rows = [];
    entries.forEach(([a, sum, dis], i) => {
      const ry = ly + 8 + i * 41;
      const on = dis || (i === 2 && st.cfgPick);

          if (s.h < 40) {
            drawTako(c, MID - 50, 24, 17, "working", Math.floor(t * 4), { shadow: false });
            text(c, "12", MID - 30, 20, { size: 13, weight: 600 });
            ring(c, MID + 22, 15, 6.5, 0.62); text(c, "62%", MID + 33, 19.5, { size: 11, weight: 600, color: COL.mint });
          } else { c.save(); c.globalAlpha *= clamp((s.since - 0.06) * 4); panelBody(c, x, w, t, cards, { since: s.since }); c.restore(); }
        });
        highlight(c, MID - 80, -4, 160, 40, win(t, w1 + 0.3, w1 + 1.4, 0.25, 0.2), T("虚拟灵动岛", "Virtual island"), { below: true, r: 12, size: 11 });
      } else {
        // 桌面小章鱼 + 浮动面板（四角圆角，没有耳朵）
        const px = SW - 220, py = SH - 64;
        const p = t < w2 + 0.8 ? hop(t, w2 + 0.3, w2 + 0.8, [px + 160, SH + 60], [px, py], 160) : hop(t, w2 + 1.2, w2 + 1.55, [px, py], [px, py], 26);
        drawTako(c, p.x, p.y, 64, "working", Math.floor(t * 4), { squash: p.squash, lift: p.lift, ground: py });
        // 徽章
        c.fillStyle = COL.mint; rr(c, p.x + 16, p.y - 70, 44, 20, 10); c.fill();
        icon(c, "bolt", p.x + 28, p.y - 60, 10, "#06121A"); text(c, "12", p.x + 36, p.y - 55.5, { size: 12, weight: 800, color: "#06121A" });
        const kp = pr(t, w2 + 1.6, w2 + 2.0, easeOutBack);
        if (kp > 0) {
          const pw = 668, ph = PH - 20, fx = px - 40 - pw, fy = py - ph - 20;
          c.save(); c.globalAlpha *= clamp(kp * 1.5);
          c.translate(fx + pw, fy + ph); c.scale(kp, kp); c.translate(-(fx + pw), -(fy + ph));
          c.shadowColor = "rgba(0,0,0,0.5)"; c.shadowBlur = 40; c.shadowOffsetY = 12;
          c.fillStyle = "#000"; rr(c, fx, fy, pw, ph, 24); c.fill(); c.shadowBlur = 0; c.shadowOffsetY = 0;
          c.translate(fx - (MID - pw / 2), fy - 6); panelBody(c, MID - pw / 2 + 14, pw - 28, t, cards);
          c.restore();
        }
        highlight(c, px - 50, py - 100, 120, 110, win(t, w2 + 0.9, w2 + 2.4, 0.2, 0.3), T("桌面小章鱼", "Desktop octopus"), { r: 18, size: 18 });
        highlight(c, SW - 160, SH - 44, 40, 40, win(t, w2 + 2.6, ch.to + 0.5, 0.2, 0.3), T("托盘图标", "Tray icon"), { r: 8, size: 18, labelX: SW - 210 });
      }
    } });
  });
}

  const ch = CH("outro"), o1 = S("o1");
  drawNight(c, t);
  const k = easeOutBack(pr(t, ch.from + 0.1, ch.from + 0.9), 1.4);
  if (LOGO.complete && k > 0) { c.save(); c.shadowColor = "rgba(91,230,181,0.5)"; c.shadowBlur = 80; const sz = 260 * k; c.drawImage(LOGO, W / 2 - sz / 2, 270 - sz / 2 + 8 * Math.sin(t * 3), sz, sz); c.restore(); }
  drawWord(c, W / 2, 500, 12, pr(t, ch.from + 0.4, ch.from + 2.0), 1, 5);
  const kt = pr(t, o1 + 1.0, o1 + 1.8, easeOutCubic);
  c.save(); c.globalAlpha *= kt;
  text(c, T("把服务器装进刘海里", "Your servers, in the notch"), W / 2, 610 + 12 * (1 - kt), { size: 44, weight: 600, align: "center", spacing: 6 });
  c.restore();
  const kv = pr(t, o1 + 1.6, o1 + 2.4, easeOutCubic);
  c.save(); c.globalAlpha *= kv;
  c.fillStyle = "rgba(91,230,181,0.16)"; rr(c, W / 2 - 220, 650, 440, 50, 25); c.fill();
  text(c, T("v0.3.0 · 免费开源 · GPL-3.0", "v0.3.0 · Free & open source · GPL-3.0"), W / 2, 684, { size: 23, weight: 700, color: COL.mint, align: "center" });
  text(c, T("macOS 14+ · Windows · Linux · 服务器上什么都不用装", "macOS 14+ · Windows · Linux · nothing to install on the server"), W / 2, 770, { size: 26, color: "rgba(255,255,255,0.72)", align: "center" });
  text(c, "github.com/zhyan0603/ServerIsland", W / 2, 822, { size: 26, weight: 600, color: COL.mint, align: "center", font: MONO });
  c.restore();
  const p = hop(t, o1 + 2.6 + Math.floor(Math.max(0, t - o1 - 2.6) / 1.2) * 1.2, o1 + 3.0 + Math.floor(Math.max(0, t - o1 - 2.6) / 1.2) * 1.2, [W / 2 + 470, 470], [W / 2 + 470, 470], 40);
  if (t > o1 + 0.8) drawTako(c, p.x, p.y, 110, "happy", Math.floor(t * 4), { squash: p.squash, lift: p.lift, ground: 470, alpha: pr(t, o1 + 0.8, o1 + 1.2) });
  burst(c, t, o1 + 1.6, W / 2, 270, { n: 60, speed: 520, size: 9, grav: 200, seed: 96, dur: 1.4 });
  const end = pr(t, TM.total - 1.6, TM.total);
  if (end > 0) { c.fillStyle = `rgba(0,0,0,${end})`; c.fillRect(0, 0, W, H); }
}

// =====================================================================================
// 字幕、章节标签
// =====================================================================================
function drawSubtitle(c, t) {
  const ids = Object.keys(TM.lines);
  for (let i = 0; i < ids.length; i++) {
    const L = TM.lines[ids[i]], next = TM.lines[ids[i + 1]];
    const end = Math.min(L.start + L.dur + 0.5, next ? next.start - 0.08 : 1e9);
    if (t < L.start - 0.12 || t > end) continue;
    const a = Math.min(pr(t, L.start - 0.12, L.start + 0.08), 1 - pr(t, end - 0.15, end));
    c.save(); c.globalAlpha = a;
    const fs = 38, lines = wrapSub(c, L.text, fs, 1560);
    const tw = Math.max(...lines.map(l => measure(c, l, { size: fs, weight: 500 })));
    const bw = tw + 56, bh = 64 + (lines.length - 1) * 50, by = H - 46 - bh;
    c.fillStyle = "rgba(6,8,16,0.72)"; rr(c, W / 2 - bw / 2, by, bw, bh, 18); c.fill();
    c.shadowColor = "rgba(0,0,0,0.6)"; c.shadowBlur = 6;
    lines.forEach((l, i) => text(c, l, W / 2, by + 44 + i * 50, { size: fs, weight: 500, align: "center", color: "#fff" }));
    c.restore();
  }
}
// 字幕太长时拆成两行：在中间附近的空格 / 标点处断开（英文版的长句会用到）
function wrapSub(c, str, fs, maxW) {
  if (measure(c, str, { size: fs, weight: 500 }) <= maxW) return [str];
  const mid = str.length / 2;
  let best = -1;
  for (let i = 1; i < str.length - 1; i++) {
    if (!/[\s，；、：—]/.test(str[i])) continue;
    if (best < 0 || Math.abs(i - mid) < Math.abs(best - mid)) best = i;
  }
  if (best < 0) best = Math.floor(mid);
  const keep = /\s/.test(str[best]) ? 0 : 1;
  return [str.slice(0, best + keep).trim(), str.slice(best + keep).trim()];
}
function drawChapterTag(c, t) {
  const chs = TM.chapters.filter(ch => ch.title);
  chs.forEach((ch, i) => {
    if (t < ch.from || t > ch.to) return;
    const a = Math.min(pr(t, ch.from + 0.3, ch.from + 0.8), 1 - pr(t, Math.min(ch.to, ch.from + 5) - 0.5, Math.min(ch.to, ch.from + 5)));
    const ki = pr(t, ch.from + 0.3, ch.from + 0.9, easeOutCubic);
    c.save(); c.globalAlpha = a;
    const x = 56 - 30 * (1 - ki), y = 52;
    const tw = measure(c, ch.title, { size: 26, weight: 700 });
    c.fillStyle = "rgba(6,8,16,0.62)"; rr(c, x, y, tw + 108, 54, 27); c.fill();
    c.fillStyle = "rgba(91,230,181,0.18)"; rr(c, x + 8, y + 8, 56, 38, 19); c.fill();
    text(c, String(i + 1).padStart(2, "0"), x + 36, y + 35, { size: 22, weight: 700, color: COL.mint, align: "center", font: MONO });
    text(c, ch.title, x + 78, y + 37, { size: 26, weight: 700 });
    // 章节进度点
    c.restore();
  });
}

const SCENES = { hook: sceneHook, add: sceneAdd, notch: sceneNotch, slurm: sceneSlurm, direct: sceneDirect, apps: sceneApps, alerts: sceneAlerts, new: sceneNew, cross: sceneCross, outro: sceneOutro };
const XFADE = 0.5;
const off = document.createElement("canvas"); off.width = W; off.height = H;
const offCtx = off.getContext("2d");

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  let idx = TM.chapters.findIndex(ch => t >= ch.from && t < ch.to);
  if (idx < 0) idx = TM.chapters.length - 1;
  const ch = TM.chapters[idx];
  if (idx > 0 && t < ch.from + XFADE) {
    // 交叉淡化：新场景先画到离屏画布，再整体按透明度叠上来
    cur = ctx; SCENES[TM.chapters[idx - 1].id](ctx, t);
    offCtx.setTransform(1, 0, 0, 1, 0, 0); offCtx.globalAlpha = 1; offCtx.clearRect(0, 0, W, H);
    cur = offCtx; SCENES[ch.id](offCtx, t); cur = ctx;
    ctx.save(); ctx.globalAlpha = easeInOutCubic((t - ch.from) / XFADE); ctx.drawImage(off, 0, 0); ctx.restore();
  } else {
    cur = ctx; SCENES[ch.id](ctx, t);
  }
  if (t < 0.6) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.6})`; ctx.fillRect(0, 0, W, H); }
  drawChapterTag(ctx, t);
  drawSubtitle(ctx, t);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.6, W / 2, H / 2, H * 1.1);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.28)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

window.ready = (async () => {
  await document.fonts.ready;
  if (!LOGO.complete) await new Promise(r => { LOGO.onload = r; LOGO.onerror = r; });
  buildWallpaper("mac"); buildWallpaper("win");
  renderFrame(0);
})();
window.renderFrame = renderFrame;
window.DURATION = TM.total;

// 预览：?play 带声音实时播放（点击播放 / 暂停，←→ 跳 3 秒）
if (location.search.includes("play")) {
  document.body.classList.add("preview");
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); document.getElementById("stage").style.transform = `scale(${s})`; };
  fit(); addEventListener("resize", fit);
  const audio = new Audio("../out/tutorial/audio.wav");
  const hint = document.createElement("div"); hint.id = "hint"; hint.textContent = T("点击播放 / 暂停 · 方向键 ←→ 跳 3 秒", "Click to play / pause · ←→ skip 3 s"); document.body.appendChild(hint);
  let playing = false;
  addEventListener("click", () => { playing = !playing; playing ? audio.play() : audio.pause(); });
  addEventListener("keydown", e => { if (e.key === "ArrowRight") audio.currentTime += 3; if (e.key === "ArrowLeft") audio.currentTime -= 3; });
  window.ready.then(() => { const loop = () => { renderFrame(audio.currentTime); requestAnimationFrame(loop); }; loop(); });
}
