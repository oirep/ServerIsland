<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ServerIsland v0.1</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; }
  canvas { display: block; }
  /* 预览模式下缩放到窗口（录制时 1:1） */
  body.preview #stage { transform-origin: 0 0; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #8aa; font: 12px system-ui; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<img id="logo" src="../Branding/logo-1024.png" style="display:none">
<script src="timeline.js"></script>
<script>
"use strict";
// =====================================================================================
// ServerIsland v0.1 发布视频 —— 全部画面都是时间 t 的纯函数，renderFrame(t) 可逐帧确定地重现。
// =====================================================================================
const TL = window.TIMELINE;
// ?vertical：竖屏版（手机），1080 × 1920；时间轴、音乐完全相同，只是重新排版
const VERT = location.search.includes("vertical");
// ?en：英文版。画面上的文字都用 T(中文, English)
const EN = new URLSearchParams(location.search).has("en");
const T = (zh, en) => EN ? en : zh;
const W = VERT ? 1080 : TL.width, H = VERT ? 1920 : TL.height, BEAT = 60 / TL.bpm;
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
document.getElementById("stage").style.width = W + "px";
document.getElementById("stage").style.height = H + "px";
const ctx = cv.getContext("2d");
const LOGO = document.getElementById("logo");

const FONT = '"PingFang SC", system-ui, -apple-system, sans-serif';
const MONO = '"SF Mono", Menlo, monospace';

// ------------------------------------------------------------------ 工具
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInCubic = k => k * k * k;
const easeInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const easeOutQuint = k => 1 - Math.pow(1 - k, 5);
// 阻尼弹簧（x 单位：拍），0→1 带一点回弹
function spring(x, stiff = 9, damp = 0.62) {
  if (x <= 0) return 0;
  const w = stiff, z = damp, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
const prog = (B, b0, b1, e = x => x) => e(clamp((B - b0) / (b1 - b0)));
// 窗口：淡入 [a, a+fi]，淡出 [b-fo, b]
const win = (B, a, b, fi = 0.4, fo = 0.4) => Math.min(prog(B, a, a + fi), 1 - prog(B, b - fo, b));
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function text(c, s, x, y, o = {}) {
  c.font = `${o.weight || 400} ${o.size || 16}px ${o.font || FONT}`;
  c.fillStyle = o.color || "#fff";
  c.textAlign = o.align || "left";
  c.textBaseline = o.base || "alphabetic";
  if (o.spacing) c.letterSpacing = o.spacing + "px"; else c.letterSpacing = "0px";
  c.fillText(s, x, y);
  return c.measureText(s).width;
}
const COL = {
  mint: "#5BE6B5", cyan: "#5CC2FF", amber: "#FFBF4D", coral: "#FF6E6E", blue: "#73A0FF", violet: "#A88CFF",
  text: "rgba(255,255,255,0.94)", sec: "rgba(255,255,255,0.58)", ter: "rgba(255,255,255,0.36)",
  card: "rgba(255,255,255,0.06)", track: "rgba(255,255,255,0.10)",
};

// ------------------------------------------------------------------ 小章鱼 Tako（与 App 内 Pet.swift 同一张像素网格）
const HEAD = ["......BBBB......", "....BBBBBBBB....", "...BHHBBBBBBB...", "..BHHBBBBBBBBB..", "..BHBBBBBBBBBB..",
  ".BBBBBBBBBBBBBB.", ".BBBBBBBBBBBBBB.", ".BBBBBBBBBBBBBB.", ".BBBBBBBBBBBBBB.", "..SBBBBBBBBBBS.."];
const LEGS_A = [".SBB.BB..BB.BBS.", ".BB..BB..BB..BB.", "BB..BB....BB..BB", "B...B......B...B"];
const LEGS_B = [".SBB.BB..BB.BBS.", "..BB.BB..BB.BB..", "..B..BB..BB..B..", ".BB...B..B...BB."];
const LEGS_T = [".SBBBBB..BBBBBS.", "..BB.BB..BB.BB..", "...B.B....B.B...", "................"];
function takoGrid(mood, tick) {
  let legs = LEGS_A;
  if (mood === "working") legs = tick % 2 ? LEGS_B : LEGS_A;
  if (mood === "happy") legs = tick % 2 ? LEGS_A : LEGS_T;
  const g = HEAD.concat(legs).map(r => r.split(""));
  const put = (r, c, ch) => { if (r >= 0 && r < 14 && c >= 0 && c < 16) g[r][c] = ch; };
  put(8, 3, "C"); put(8, 12, "C");
  const blink = mood === "idle" && tick % 9 === 0;
  if (mood === "happy") {
    for (const c of [4, 11]) { put(6, c, "E"); put(7, c - 1, "E"); put(7, c + 1, "E"); }
    put(8, 7, "M"); put(8, 8, "M"); put(9, 7, "C"); put(9, 8, "C");
  } else if (mood === "sad") {
    for (const c of [4, 11]) { put(5, c - 1, "E"); put(5, c + 1, "E"); put(6, c, "E"); put(7, c - 1, "E"); put(7, c + 1, "E"); }
    put(9, 7, "M"); put(9, 8, "M"); put(8, 6, "M"); put(8, 9, "M");
    put(2, 13, "R"); put(3, 13, "R"); put(3, 14, "R");
  } else if (mood === "waiting") {
    for (const c of [4, 10]) { put(6, c, "S"); put(6, c + 1, "S"); put(7, c, "E"); put(7, c + 1, "E"); }
  } else {
    if (blink) { for (const c of [4, 10]) { put(7, c, "E"); put(7, c + 1, "E"); } }
    else { for (const c of [4, 10]) { put(6, c, "W"); put(6, c + 1, "E"); put(7, c, "E"); put(7, c + 1, "E"); } }
    put(8, 7, "M"); put(8, 8, "M");
  }
  return g;
}
const TAKO_COL = { B: "#5CE6B5", S: "#2EAD87", H: "#BDF9DF", E: "#0A0F1F", W: "#FFFFFF", C: "#FF8FAB", M: "#0A0F1F", R: "#7CC8FF" };
const TAKO_SAD = { B: "#FF8C8C", S: "#CC545C", H: "#FFCCCC" };
// (x, y) = 脚底中心；h = 身高（14 格）；squash > 0 压扁、< 0 拉长
function drawTako(c, x, y, h, mood = "idle", tick = 0, o = {}) {
  const px = h / 14, g = takoGrid(mood, tick);
  const sq = o.squash || 0;
  const sx = 1 + sq * 0.28, sy = 1 - sq * 0.28;
  c.save();
  c.globalAlpha *= (o.alpha ?? 1);
  if (o.shadow !== false) {
    const lift = o.lift || 0;
    c.fillStyle = `rgba(0,0,0,${0.28 * clamp(1 - lift / (h * 3))})`;
    c.beginPath();
    c.ellipse(x, (o.ground ?? y) + px * 0.6, h * 0.5 * (1 - clamp(lift / (h * 4)) * 0.5), h * 0.09, 0, 0, Math.PI * 2);
    c.fill();
  }
  c.translate(x, y);
  if (o.rot) c.rotate(o.rot);
  c.scale(sx * (o.flip ? -1 : 1), sy);
  if (o.glow !== false) { c.shadowColor = mood === "sad" ? "rgba(255,110,110,0.55)" : "rgba(91,230,181,0.5)"; c.shadowBlur = h * 0.35; }
  const pal = mood === "sad" ? Object.assign({}, TAKO_COL, TAKO_SAD) : TAKO_COL;
  for (let r = 0; r < 14; r++) for (let col = 0; col < 16; col++) {
    const ch = g[r][col];
    if (ch === ".") continue;
    c.fillStyle = pal[ch];
    c.fillRect((col - 8) * px, (r - 14) * px, px + 0.6, px + 0.6);
  }
  c.restore();
}
// 抛物线跳跃：在 [b0, b1] 拍从 p0 跳到 p1，返回 {x, y, lift, squash}
function hop(B, b0, b1, p0, p1, height) {
  const k = clamp((B - b0) / (b1 - b0));
  const x = lerp(p0[0], p1[0], k), base = lerp(p0[1], p1[1], k);
  const y = base - Math.sin(k * Math.PI) * height;
  // 起跳前蓄力、落地后压扁回弹
  let squash = 0;
  const pre = (b0 - B) / 0.25, post = (B - b1) / 0.5;
  if (B < b0 && pre < 1) squash = 0.6 * (1 - pre);
  else if (B > b1 && post < 1) squash = 0.9 * Math.exp(-post * 3) * Math.cos(post * 9);
  else if (B >= b0 && B <= b1) squash = -0.35 * Math.sin(k * Math.PI);
  return { x, y, lift: base - y, squash, ground: base };
}

// 5x7 像素字（ServerIsland 字样）
const PFONT = {
  S: [".####", "#....", "#....", ".###.", "....#", "....#", "####."], e: [".....", ".....", ".###.", "#...#", "#####", "#....", ".###."],
  r: [".....", ".....", "#.##.", "##..#", "#....", "#....", "#...."], v: [".....", ".....", "#...#", "#...#", "#...#", ".#.#.", "..#.."],
  I: ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "#####"], s: [".....", ".....", ".####", "#....", ".###.", "....#", "####."],
  l: [".##..", "..#..", "..#..", "..#..", "..#..", "..#..", ".###."], a: [".....", ".....", ".###.", "....#", ".####", "#...#", ".####"],
  n: [".....", ".....", "#.##.", "##..#", "#...#", "#...#", "#...#"], d: ["....#", "....#", ".##.#", "#..##", "#...#", "#...#", ".####"],
};
function wordCells(word) {
  const cells = []; let x = 0;
  for (const ch of word) {
    const g = PFONT[ch];
    const cols = [0, 1, 2, 3, 4].filter(c => g.some(r => r[c] === "#"));
    const lo = Math.min(...cols), hi = Math.max(...cols);
    g.forEach((row, r) => { for (let c = lo; c <= hi; c++) if (row[c] === "#") cells.push([x + c - lo, r]); });
    x += hi - lo + 2;
  }
  return { cells, cols: x - 1 };
}
const WORD = wordCells("ServerIsland");
// 像素字：组装进度 k（0 = 散落，1 = 成形）
function drawWord(c, cx, cy, cell, k, alpha = 1, seed = 1) {
  const w = WORD.cols * cell, x0 = cx - w / 2;
  const grad = c.createLinearGradient(x0, 0, x0 + w, 0);
  grad.addColorStop(0, COL.mint); grad.addColorStop(1, "#7CCBFF");
  c.save();
  c.globalAlpha *= alpha;
  c.fillStyle = grad;
  c.shadowColor = "rgba(91,230,181,0.45)"; c.shadowBlur = cell * 1.6;
  WORD.cells.forEach(([col, row], i) => {
    const d = rnd(i * 3 + seed), kk = clamp((k - d * 0.45) / 0.55);
    const e = easeOutBack(kk, 1.4);
    const tx = x0 + col * cell, ty = cy + (row - 3.5) * cell;
    const sx = cx + (rnd(i * 7 + seed) - 0.5) * W * 1.1, sy = cy + (rnd(i * 11 + seed) - 0.5) * H * 0.9;
    if (kk <= 0) return;
    c.globalAlpha = alpha * clamp(kk * 3);
    c.fillRect(lerp(sx, tx, e), lerp(sy, ty, e), cell + 0.5, cell + 0.5);
  });
  c.restore();
}

// ------------------------------------------------------------------ 背景：夜空 + 像素海浪（与 logo 同风格）
function drawNight(c, B, alpha = 1) {
  c.save();
  c.globalAlpha = alpha;
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#121836"); g.addColorStop(0.6, "#112B4A"); g.addColorStop(1, "#0D4A57");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const rg = c.createRadialGradient(W / 2, H * 0.55, 0, W / 2, H * 0.55, H * 0.75);
  rg.addColorStop(0, "rgba(91,230,181,0.22)"); rg.addColorStop(1, "rgba(91,230,181,0)");
  c.fillStyle = rg; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = rnd(i) * W, y = rnd(i + 99) * H * 0.7, sz = 2 + Math.floor(rnd(i + 7) * 3) * 2;
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(B * 1.6 + i * 1.7));
    c.globalAlpha = alpha * tw * 0.7 * clamp(B * 2 - rnd(i + 3) * 2);
    c.fillStyle = "#fff"; c.fillRect(Math.round(x), Math.round(y), sz, sz);
  }
  c.globalAlpha = alpha;
  // 像素海浪：两行方块缓慢流动
  for (let row = 0; row < 3; row++) {
    const y0 = H - 150 + row * 44, speed = (row + 1) * 18, off = (B * BEAT * speed) % 60;
    for (let x = -60; x < W + 60; x += 60) {
      const k = Math.floor((x + off * (row % 2 ? -1 : 1)) / 60);
      const dy = (Math.abs(k) % 4 === 1 || Math.abs(k) % 4 === 2) ? 14 : 0;
      c.fillStyle = row === 0 ? "rgba(127,216,255,0.30)" : row === 1 ? "rgba(91,230,181,0.18)" : "rgba(91,230,181,0.10)";
      rr(c, x + (row % 2 ? -off : off), y0 + dy, 40, 16, 3); c.fill();
    }
  }
  c.restore();
}

// ------------------------------------------------------------------ Mac 世界（单位：屏幕点，1512 × 982，与 14 寸 MacBook Pro 一致）
const SW = 1512, SH = 982, MENU = 32, NOTCH_W = 185, MID = SW / 2;
let wallpaper = null;
function buildWallpaper() {
  const sc = 2.4, oc = document.createElement("canvas");
  oc.width = SW * sc; oc.height = SH * sc;
  const c = oc.getContext("2d"); c.scale(sc, sc);
  const g = c.createLinearGradient(0, 0, SW * 0.3, SH);
  g.addColorStop(0, "#3C4C8F"); g.addColorStop(0.45, "#8D6FB1"); g.addColorStop(0.75, "#D99A9C"); g.addColorStop(1, "#F2C89A");
  c.fillStyle = g; c.fillRect(0, 0, SW, SH);
  const blobs = [[300, 300, 380, "rgba(90,130,255,0.45)"], [1200, 260, 420, "rgba(255,150,200,0.35)"], [900, 800, 460, "rgba(255,200,140,0.40)"], [200, 850, 300, "rgba(120,90,200,0.35)"]];
  for (const [x, y, r, col] of blobs) {
    const rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col); rg.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = rg; c.fillRect(0, 0, SW, SH);
  }
  wallpaper = oc;
}

// 竖屏：横屏镜头能看到的世界宽度 V = 1920 / z，换算成竖屏要看到的宽度（单调、连续）：
// 特写（刘海两翼、提示）保持差不多的放大；看面板时让 668 宽的面板刚好占满；全景时整台电脑都放得下。
const VKNOTS = [[0, 0], [680, 480], [900, 690], [1300, 740], [1960, 1960]];
function vertCam(cam) {
  const V = 1920 / cam.z;
  let Vt = V;
  for (let i = 1; i < VKNOTS.length; i++) {
    const [a, fa] = VKNOTS[i - 1], [b, fb] = VKNOTS[i];
    if (V <= b || i === VKNOTS.length - 1) { Vt = fa + (fb - fa) * clamp((V - a) / (b - a), 0, 1.5); break; }
  }
  const z = W / Vt, hh = H / 2 / z;
  let y;
  if (2 * hh >= SH + 140) y = SH / 2 + 30;                       // 整台电脑放得下：居中
  else y = Math.min(Math.max(cam.y, -30 + hh), SH + 70 - hh);     // 否则顶部贴着刘海
  return { x: cam.x, y, z };
}
// 摄像机：世界坐标点 (cx, cy) 位于画面中心，缩放 z
function withCamera(c, cam, fn) {
  if (VERT) cam = vertCam(cam);
  c.save();
  c.translate(W / 2, H / 2); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y);
  fn();
  c.restore();
}
const CAM_FULL = { x: MID, y: SH / 2 + 30, z: 0.98 };
function camKeys(B, keys) {
  // keys: [[beat, {x,y,z}], ...]，相邻关键帧之间 easeInOutCubic
  if (B <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (B <= keys[i][0]) {
      const [b0, a] = keys[i - 1], [b1, b] = keys[i];
      const k = easeInOutCubic((B - b0) / (b1 - b0));
      // 缩放在对数空间插值，推拉更自然
      return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), k)) };
    }
  }
  return keys[keys.length - 1][1];
}

function drawLaptop(c) {
  // 机身底座
  c.save();
  const baseG = c.createLinearGradient(0, SH + 20, 0, SH + 62);
  baseG.addColorStop(0, "#C9CDD4"); baseG.addColorStop(1, "#8E939B");
  c.fillStyle = baseG;
  c.beginPath();
  c.moveTo(-120, SH + 24); c.lineTo(SW + 120, SH + 24); c.lineTo(SW + 60, SH + 58); c.lineTo(-60, SH + 58); c.closePath(); c.fill();
  c.fillStyle = "#9CA1A9"; rr(c, MID - 110, SH + 24, 220, 10, 5); c.fill();
  // 屏幕外框
  c.fillStyle = "#0B0B0D"; rr(c, -22, -22, SW + 44, SH + 46, 30); c.fill();
  c.strokeStyle = "rgba(255,255,255,0.08)"; c.lineWidth = 2; rr(c, -22, -22, SW + 44, SH + 46, 30); c.stroke();
  c.restore();
}

function drawDesktop(c, B, o = {}) {
  c.save();
  rr(c, 0, 0, SW, SH, 10); c.clip();
  c.drawImage(wallpaper, 0, 0, SW, SH);
  // 终端窗口
  const tx = 110, ty = 430, tw = 600, th = 300;
  c.save();
  c.shadowColor = "rgba(0,0,0,0.35)"; c.shadowBlur = 40; c.shadowOffsetY = 18;
  c.fillStyle = "rgba(24,26,34,0.92)"; rr(c, tx, ty, tw, th, 12); c.fill();
  c.restore();
  c.fillStyle = "rgba(255,255,255,0.06)"; rr(c, tx, ty, tw, 30, 12); c.fill();
  ["#FF5F57", "#FEBC2E", "#28C840"].forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.arc(tx + 18 + i * 20, ty + 15, 6, 0, 7); c.fill(); });
  text(c, "demo@4090-box: ~/projects/Li3PS4/nep-train", tx + tw / 2, ty + 20, { size: 12, color: COL.sec, align: "center" });
  const lines = [["$ ", "sbatch aimd.sh"], ["", "Submitted batch job 8812044"], ["$ ", "squeue --me"], ["", "JOBID   NAME        ST  TIME"],
    ["", "8812044 aimd_Li3PS4 R   1:23:40"], ["", "8812300_[22-39] eos_scan PD 0:00"], ["$ ", "tail -f loss.out"], ["", "7800  0.1815  0.0451  0.0647  0.00074 …"]];
  lines.forEach(([p, s], i) => {
    const y = ty + 58 + i * 28;
    if (p) text(c, p, tx + 18, y, { size: 15, font: MONO, color: COL.mint });
    text(c, s, tx + 18 + (p ? 20 : 0), y, { size: 15, font: MONO, color: p ? "#fff" : COL.sec });
  });
  // 光标闪烁
  if (Math.floor(B) % 2 === 0) { c.fillStyle = COL.mint; c.fillRect(tx + 18, ty + 58 + 8 * 28 - 14, 9, 17); }
  // Dock
  const dw = 640, dh = 66, dx = MID - dw / 2, dy = SH - 84;
  c.fillStyle = "rgba(255,255,255,0.22)"; rr(c, dx, dy, dw, dh, 20); c.fill();
  c.strokeStyle = "rgba(255,255,255,0.25)"; c.lineWidth = 1; rr(c, dx, dy, dw, dh, 20); c.stroke();
  const icons = ["#4AA3FF", "#FF7A59", "#2BD17E", "#FFC53D", "#9B7BFF", "logo", "#3E3E46", "#FF5EA8", "#58D5FF"];
  icons.forEach((col, i) => {
    const ix = dx + 18 + i * 68, iy = dy + 9;
    if (col === "logo") { if (LOGO.complete) c.drawImage(LOGO, ix - 6, iy - 6, 60, 60); }
    else {
      const ig = c.createLinearGradient(0, iy, 0, iy + 48); ig.addColorStop(0, col); ig.addColorStop(1, shade(col, -40));
      c.fillStyle = ig; rr(c, ix, iy, 48, 48, 12); c.fill();
    }
  });
  // 菜单栏
  c.fillStyle = "rgba(255,255,255,0.20)"; c.fillRect(0, 0, SW, MENU);
  text(c, "", 22, 22, { size: 17, color: "#fff" });
  text(c, "Finder", 52, 22, { size: 14, weight: 700 });

    p = { x: W / 2, y: ground, lift: 0, squash: post < 1 ? 1.0 * Math.exp(-post * 2.6) * Math.cos(post * 10) : 0, ground };
    if (B > 4 && B < 6.6) mood = "happy";
    // 第 5、6 拍随节拍小跳
    for (const hb of [5, 6]) if (B >= hb - 0.0 && B < hb + 0.5) { const h = hop(B, hb, hb + 0.45, [W / 2, ground], [W / 2, ground], 34); p = h; }
  } else {
    const k = clamp((B - 7.5) / 0.5);
    p = { x: W / 2, y: lerp(ground, -200, easeInCubic(k)), lift: k * 600, squash: -0.5 * k, ground };
  }
  if (B >= 2) drawTako(c, p.x, p.y, 230, mood, tick, { squash: p.squash, lift: p.lift, ground });
  // 落地冲击波
  if (B >= 3 && B < 4.2) {
    const k = (B - 3) / 1.2;
    c.save(); c.strokeStyle = `rgba(91,230,181,${0.6 * (1 - k)})`; c.lineWidth = 6 * (1 - k);
    c.beginPath(); c.ellipse(W / 2, ground + 10, 160 + 380 * easeOutCubic(k), 26 + 60 * easeOutCubic(k), 0, 0, 7); c.stroke(); c.restore();
  }
  burst(c, B, 3, W / 2, ground - 10, { n: 22, speed: 340, size: 10, grav: 260, seed: 3 });
  // 像素字 + 标语
  const kw = prog(B, 4, 6.2);
  if (kw > 0) drawWord(c, W / 2, wordY, VERT ? 13 : 15, kw, 1 - prog(B, 7.4, 8));
  const ks = prog(B, 6, 6.8, easeOutCubic);
  if (ks > 0) {
    c.save(); c.globalAlpha = ks * (1 - prog(B, 7.4, 8));
    text(c, T("把服务器装进刘海里", "Your servers, in the notch"), W / 2, tagY + 16 * (1 - ks), { size: 40, weight: 500, color: "rgba(255,255,255,0.86)", align: "center", spacing: 8 });
    c.restore();
  }
}

const FILES = [["nep.in", "#A88CFF"], ["train.xyz", "#5CC2FF"], ["loss.out", "#5BE6B5"], ["nep.txt", "#FFBF4D"]];
function sceneNep(c, B) {

    const fields = [[T("软件", "Software"), T("NEP 训练", "NEP training")], [T("速度", "Speed"), T("26.4 代/秒", "26.4 gen/s")],
      [T("进度", "Progress"), T(`${gen.toLocaleString()} / 20,000 代（${Math.round(gen / 200)}%）`, `${gen.toLocaleString()} / 20,000 gen (${Math.round(gen / 200)}%)`)], [T("预计剩余", "ETA"), eta],
      ["Loss", `Total ${(0.32 * Math.pow(gen / 1000, -0.21)).toFixed(4)} · Force ${(0.13 * Math.pow(gen / 1000, -0.22)).toFixed(4)}`], [T("目录", "Directory"), "~/projects/Li3PS4/nep-train"]];
    fields.forEach(([k, v], i) => {
      const col = i % 2, row = Math.floor(i / 2);
      text(c, k, x + 28 + col * 310, y0 + 26 + row * 30, { size: 10, weight: 500, color: COL.ter });
      text(c, v, x + 92 + col * 310, y0 + 26 + row * 30, { size: 10.5, font: MONO, color: i === 2 ? COL.mint : COL.sec });
    });
    bar(c, x + 28, y0 + 96, w - 56, gen / 20000, null, 5);
    // loss 曲线
    const gy = y0 + 122, gh = 160, gx = x + 14, gw = w - 28;
    c.fillStyle = "rgba(255,255,255,0.04)"; rr(c, gx, gy, gw, gh, 12); c.fill();
    text(c, "loss.out", gx + 14, gy + 22, { size: 10.5, weight: 600, color: COL.sec });
    [["Total", COL.mint, 0.32, -0.21], ["Force", COL.cyan, 0.13, -0.22], ["Energy", COL.amber, 0.004, -0.35], ["Virial", COL.violet, 0.03, -0.18]].forEach(([n, col, a0, ex], li) => {

      text(c, "train", fx + 110, fy + 28, { size: 15, weight: 600, color: "#222" });
      text(c, "4090-box:~/projects/Li3PS4/nep-train", fx + fw - 20, fy + 28, { size: 12, color: "#888", align: "right", font: MONO });
      FILES.forEach(([n, col], i) => {
        const k = easeOutBack(prog(B, 44 + i - 0.15, 44 + i + 0.25));
        const ix = fx + 90 + i * 150, iy = fy + 130;
        c.save(); c.translate(ix + 40, iy + 50); c.scale(k, k);
        c.fillStyle = "#fff"; c.strokeStyle = "rgba(0,0,0,0.12)"; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(-32, -46); c.lineTo(14, -46); c.lineTo(32, -28); c.lineTo(32, 46); c.lineTo(-32, 46); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = col; rr(c, -24, 14, 48, 18, 4); c.fill();
        text(c, n.split(".")[1].toUpperCase(), 0, 27.5, { size: 11, weight: 800, color: "#fff", align: "center" });
        c.restore();
        text(c, n, ix + 40, iy + 130, { size: 15, color: "#333", align: "center", font: MONO });
        // 识别：nep.in 和 loss.out 高亮
        if (B > 48 && (i === 0 || i === 2)) {
          const kh = prog(B, 48, 48.4, easeOutBack);
          c.strokeStyle = COL.mint; c.lineWidth = 3.5; c.globalAlpha = ka * kh;
          rr(c, ix - 8, iy - 8, 96, 160, 14); c.stroke(); c.globalAlpha = ka;
        }
      });
      // 识别结果
      if (B > 48.2) {
        const kr = easeOutBack(prog(B, 48.2, 48.8));
        c.save(); c.translate(fx + fw / 2, fy + fh - 58); c.scale(kr, kr);
        c.fillStyle = "#0B0F1E"; rr(c, -230, -26, 460, 52, 26); c.fill();
        text(c, T("nep.in  +  loss.out   →   NEP 训练", "nep.in  +  loss.out   →   NEP training"), 0, 7, { size: 18, weight: 700, color: COL.mint, align: "center", font: FONT });
        c.restore();
      }
      // 其他软件也认得：依次弹出
      [["INCAR + OSZICAR → VASP", COL.cyan], ["log.lammps → LAMMPS", COL.amber], [T("自定义规则 → 你的程序", "custom rule → your code"), COL.violet]].forEach(([label, col], i) => {
        const kp = easeOutBack(prog(B, 48.7 + i * 0.4, 49.1 + i * 0.4));
        if (kp <= 0) return;
        const pw = 204, px = fx + (fw - pw * 3 - 14 * 2) / 2 + i * (pw + 14) + pw / 2, py = fy + fh - 118;
        c.save(); c.translate(px, py); c.scale(kp, kp);
        c.shadowColor = "rgba(0,0,0,0.3)"; c.shadowBlur = 16; c.shadowOffsetY = 6;
        c.fillStyle = "rgba(11,15,30,0.94)"; rr(c, -pw / 2, -17, pw, 34, 17); c.fill();
        c.shadowBlur = 0; c.shadowOffsetY = 0;
        c.strokeStyle = col; c.globalAlpha *= 0.7; c.lineWidth = 1.5; rr(c, -pw / 2, -17, pw, 34, 17); c.stroke(); c.globalAlpha /= 0.7;
        text(c, label, 0, 5, { size: 13, weight: 700, color: col, align: "center" });
        c.restore();
      });
      c.restore();
    },
    above: () => {
      // 小章鱼在文件之间跳
      if (B < 50.3) {
        const pos = i => [fx + 130 + i * 150, fy + 128];
        let p;
        if (B < 44) p = hop(B, 43.4, 44, [fx + 40, fy + 300], pos(0), 120);
        else if (B < 47) { const i = Math.floor(B - 44); p = hop(B, 44 + i + 0.5, 45 + i, pos(i), pos(i + 1), 70); if (B < 44 + i + 0.5) p = hop(B, 44 + i, 44 + i, pos(i), pos(i), 0); }
        else if (B < 49.6) p = { x: pos(3)[0], y: pos(3)[1], squash: hop(B, 47, 47, pos(3), pos(3), 0).squash, lift: 0 };
        else p = hop(B, 49.6, 50.3, pos(3), [MID, 20], 160);
        const mood = B > 48.2 && B < 49.6 ? "happy" : "working";
        drawTako(c, p.x, p.y, 54, mood, Math.floor(B * 2), { squash: p.squash, lift: p.lift, ground: fy + 128 });
      }
    }
  });
}

// 5. 提醒：完成叮咚 / 失败咚咚
function sceneAlerts(c, B) {
  const cam = camKeys(B, [[56, { x: MID, y: 225, z: 1.8 }], [57.4, { x: MID, y: 175, z: 2.75 }], [68, { x: MID, y: 178, z: 2.85 }]]);
  const keys = [[0, "detail"], [56.2, "collapsed"], [57.8, "toast"], [61.2, "collapsed"], [61.8, "toast"], [65.2, "collapsed"]];
  const toastOf = B => B < 61.2
    ? { ok: true, host: T("4090 工作站", "4090 Workstation"), min: 6, title: T("NEP 训练完成", "NEP training finished"), sub: T("20,000 代 · Total 0.1382 · nep-train", "20,000 gen · Total 0.1382 · nep-train") }
    : { ok: false, host: T("4090 工作站", "4090 Workstation"), min: 8, title: T("LAMMPS MD 提前结束", "LAMMPS MD ended early"), sub: T("停在 386,000/1.00M 步 · npt-1200K", "stopped at 386,000/1.00M steps · npt-1200K") };
  macWorld(c, B, cam, keys, (x, w, s) => {
    if (s.name === "collapsed") {
      c.save(); c.globalAlpha = clamp(s.since * 3);
      drawWings(c, x, w, B, { mood: B > 62 && B < 65.5 ? "sad" : (B > 58 && B < 61.5 ? "happy" : "working"), k: B > 61 ? 0.62 : 0.97 });
      c.restore();
    } else if (s.name === "toast") drawToast(c, x, w, B, Object.assign(toastOf(B), { since: s.since }));
  }, {
    above: (s) => {
      // 菜单栏上的小章鱼跟着情绪蹦
      const hx = MID + 300;
      let p = { x: hx, y: MENU - 2, squash: 0, lift: 0 }, mood = "idle";
      if (B > 57.5 && B < 61) { p = hop(B, 58 + (Math.floor(B - 58) >= 0 ? Math.floor(B - 58) : 0), 58 + Math.max(0, Math.floor(B - 58)) + 0.5, [hx, MENU - 2], [hx, MENU - 2], 26); mood = "happy"; }
      if (B >= 62 && B < 65) mood = "sad";
      drawTako(c, p.x, p.y, 36, mood, Math.floor(B * 2), { squash: p.squash, lift: p.lift, ground: MENU - 2 });
      burst(c, B, 58, MID, MENU + 40, { n: 30, speed: 160, size: 4, grav: 90, seed: 58 });
      // 静音演示：铃铛划掉
      if (B > 64.7) {
        const k = easeOutBack(prog(B, 65, 65.4)), o = 1 - prog(B, 67.4, 68);
        c.save(); c.globalAlpha = k * o; c.translate(MID - 260, MENU + 36); c.scale(k, k);
        c.fillStyle = "rgba(10,12,22,0.92)"; rr(c, -84, -18, 168, 36, 18); c.fill();
        text(c, T("🔕  已静音 HPC 集群", "🔕  HPC Cluster muted"), 0, 5.5, { size: 12.5, weight: 600, color: COL.amber, align: "center" });
        c.restore();
      }
    }
  });
}

// 6. 蒙太奇：九张功能卡，小章鱼逐张跳过
const CHIPS = EN
  ? [["🧪", "VASP / LAMMPS", "MD in %, relaxations in steps"], ["🧩", "Custom rules", "A file + a keyword, tested live"], ["📈", "Live curves", "Loss and energy in job details"],
     ["🏝", "Idle servers fold", "No jobs? Just one line."], ["⏸", "Pause or mute", "Skip the ones you know are idle"], ["🔑", "OTP logins", "Typed into ssh, never stored"],
     ["✋", "Hold + confirm", "No accidental cancels"], ["🗂", "Last 24 hours", "Works without sacct, too"], ["🌏", "English / 中文", "Switch in one click"]]
  : [["🧪", "VASP / LAMMPS", "MD 看百分比，优化看离子步"], ["🧩", "自定义识别规则", "文件 + 关键字，当场测试"], ["📈", "loss / 能量曲线", "点开详情就能看"],
     ["🏝", "空闲机器合并", "没任务的收成一行"], ["⏸", "暂停 / 静音单台", "知道没任务就别查"], ["🔑", "动态口令登录", "输入只交给 ssh，不保存"],
     ["✋", "按住 + 二次确认", "取消作业不怕误触"], ["🗂", "最近 24 小时", "sacct 没开也能记"], ["🌏", "中文 / English", "一键切换"]];
function sceneMontage(c, B) {
  drawNight(c, B + 40, 1);
  // 轻微脉动的网格光
  const pulse = 0.5 + 0.5 * Math.cos((B - Math.floor(B)) * Math.PI * 2);
  c.fillStyle = `rgba(91,230,181,${0.04 + 0.04 * (1 - pulse)})`; c.fillRect(0, 0, W, H);
  const kt = prog(B, 68, 68.8, easeOutBack), kout = prog(B, 79.3, 80);
  c.save(); c.globalAlpha = kt * (1 - kout);
  text(c, T("还有更多", "And there's more"), W / 2, VERT ? 190 : 150, { size: 60, weight: 700, align: "center" });
  c.restore();
  // 横屏 3×3；竖屏单列
  const cw = VERT ? 880 : 480, ch = VERT ? 150 : 170, gap = VERT ? 22 : 34;
  const gx = VERT ? (W - cw) / 2 : W / 2 - (cw * 3 + gap * 2) / 2, gy = VERT ? 260 : 230;
  const pos = i => VERT ? [gx, gy + i * (ch + gap)] : [gx + (i % 3) * (cw + gap), gy + Math.floor(i / 3) * (ch + gap)];
  CHIPS.forEach(([ic, t1, t2], i) => {
    const b = 69 + i;
    const k = easeOutBack(prog(B, b - 0.05, b + 0.35), 2.2);
    if (k <= 0) return;
    const [x, y] = pos(i);
    const shrink = easeInCubic(prog(B, 79 + i * 0.03, 79.6 + i * 0.03));
    c.save();
    c.translate(x + cw / 2, y + ch / 2);
    const land = Math.exp(-Math.max(0, B - b) * 6) * Math.sin(Math.max(0, B - b) * 18) * 0.04;
    c.scale(k * (1 - shrink) * (1 + land), k * (1 - shrink) * (1 - land));
    c.globalAlpha *= 1 - shrink;
    c.fillStyle = "rgba(255,255,255,0.07)"; rr(c, -cw / 2, -ch / 2, cw, ch, 26); c.fill();
    c.strokeStyle = B >= b && B < b + 1 ? `rgba(91,230,181,${0.9 * (1 - (B - b))})` : "rgba(255,255,255,0.10)";
    c.lineWidth = 2; rr(c, -cw / 2, -ch / 2, cw, ch, 26); c.stroke();
    text(c, ic, -cw / 2 + 60, 18, { size: 54, align: "center" });
    text(c, t1, -cw / 2 + 112, -6, { size: 34, weight: 700 });
    text(c, t2, -cw / 2 + 112, 38, { size: 22, color: "rgba(255,255,255,0.62)" });
    c.restore();
  });
  // 小章鱼在卡片上跳
  if (B < 79.2) {
    const top = i => { const [x, y] = pos(i); return [x + cw - 70, y + 4]; };
    let p;
    if (B < 69) p = hop(B, 68.4, 69, [W / 2, H + 100], top(0), 260);
    else { const i = clamp(Math.floor(B - 69), 0, 8); p = i < 8 ? hop(B, 69 + i + 0.45, 70 + i, top(i), top(i + 1), 120) : { x: top(8)[0], y: top(8)[1], squash: 0, lift: 0 }; if (B < 69 + i + 0.45) p = Object.assign(hop(B, 69 + i, 69 + i, top(i), top(i), 0), { x: top(i)[0], y: top(i)[1] }); }
    drawTako(c, p.x, p.y, 72, "working", Math.floor(B * 2), { squash: p.squash, lift: p.lift, ground: p.ground ?? p.y });
  }
  for (let i = 0; i < 9; i++) { const [x, y] = pos(i); burst(c, B, 69 + i, x + cw - 70, y + 4, { n: 12, speed: 110, size: 6, grav: 140, seed: i * 13, dur: 0.9 }); }
  flash(c, B, 68, 0.45, "91,230,181", 0.35);
}

// 7. 片尾
function sceneOutro(c, B) {
  const cam = camKeys(B, [[80, { x: MID, y: SH / 2 + 30, z: 0.95 }], [88, { x: MID, y: SH / 2 + 10, z: 1.0 }], [90, { x: MID, y: SH / 2 + 30, z: 0.9 }], [100, { x: MID, y: SH / 2 + 30, z: 0.86 }]]);
  const keys = [[0, "hidden"], [87.95, "collapsed"]];
  const dim = prog(B, 89.2, 90.4, easeInOutCubic);
  macWorld(c, B, cam, keys, (x, w, s) => {
    if (s.name === "collapsed") { c.save(); c.globalAlpha = clamp(s.since * 3); drawWings(c, x, w, B, { mood: "happy", run: 0, k: 1 }); c.restore(); }
  }, {
    above: () => {
      if (B < 88.15) {
        const pts = [[MID - 520, SH - 120], [MID + 160, SH - 110], [420, 430], [MID + 420, MENU - 2], [MID, 18]];
        let p;
        if (B < 81) p = hop(B, 80, 81, [-120, SH - 160], pts[0], 380);
        else if (B < 83) p = hop(B, 82, 83, pts[0], pts[1], 300);
        else if (B < 85) p = hop(B, 84, 85, pts[1], pts[2], 360);
        else if (B < 87) p = hop(B, 86, 87, pts[2], pts[3], 380);
        else p = hop(B, 87.5, 88, pts[3], pts[4], 90);
        if (B >= 81 && B < 82) p = Object.assign(hop(B, 81, 81, pts[0], pts[0], 0), { x: pts[0][0], y: pts[0][1] });
        if (B >= 83 && B < 84) p = Object.assign(hop(B, 83, 83, pts[1], pts[1], 0), { x: pts[1][0], y: pts[1][1] });
        if (B >= 85 && B < 86) p = Object.assign(hop(B, 85, 85, pts[2], pts[2], 0), { x: pts[2][0], y: pts[2][1] });
        if (B >= 87 && B < 87.5) p = Object.assign(hop(B, 87, 87, pts[3], pts[3], 0), { x: pts[3][0], y: pts[3][1] });
        const size = B > 87.6 ? lerp(70, 18, prog(B, 87.6, 88.1)) : 70;
        drawTako(c, p.x, p.y, size, B < 86 ? "happy" : "working", Math.floor(B * 2), { squash: p.squash, lift: p.lift, ground: p.ground ?? p.y, rot: B > 86 && B < 87 ? (B - 86) * Math.PI * 2 : 0 });
      }
      burst(c, B, 88.1, MID, MENU / 2, { n: 26, speed: 120, size: 4, grav: 40, seed: 88 });
    }
  });
  // 变暗 + 标志
  if (dim > 0) {
    c.fillStyle = `rgba(6,9,22,${0.82 * dim})`; c.fillRect(0, 0, W, H);
    const L = VERT
      ? { logo: 600, logoSz: 360, word: 900, cell: 12, tag: 1020, pill: 1072, f1: 1196, f2: 1240, f3: 1300 }
      : { logo: 300, logoSz: 300, word: 545, cell: 12, tag: 655, pill: 700, f1: 810, f2: 852 };
    const k = easeOutBack(prog(B, 90, 90.9), 1.4);
    const end = prog(B, 98.4, 100);
    c.save(); c.globalAlpha = (1 - end);
    if (LOGO.complete && k > 0) {
      const sz = L.logoSz * k;
      c.save(); c.shadowColor = "rgba(91,230,181,0.5)"; c.shadowBlur = 80;
      c.drawImage(LOGO, W / 2 - sz / 2, L.logo - sz / 2 + 10 * Math.sin(B * Math.PI / 2), sz, sz); c.restore();
    }
    drawWord(c, W / 2, L.word, L.cell, prog(B, 90.4, 92.2), 1, 5);
    const kt = prog(B, 92, 93, easeOutCubic);
    c.globalAlpha = (1 - end) * kt;
    text(c, T("把服务器装进刘海里", "Your servers, in the notch"), W / 2, L.tag + 14 * (1 - kt), { size: 44, weight: 600, align: "center", spacing: 6 });
    const kv = prog(B, 93, 94, easeOutCubic);
    c.globalAlpha = (1 - end) * kv;
    const pw = EN ? 400 : 340;
    c.fillStyle = "rgba(91,230,181,0.16)"; rr(c, W / 2 - pw / 2, L.pill, pw, 48, 24); c.fill();
    text(c, T("v0.1.0 · 免费开源", "v0.1.0 · Free & open source"), W / 2, L.pill + 32, { size: 22, weight: 700, color: COL.mint, align: "center" });
    const kf = prog(B, 94, 95, easeOutCubic);
    c.globalAlpha = (1 - end) * kf;
    if (VERT) {
      text(c, T("Slurm / 直连服务器 · 服务器上什么都不用装", "Slurm & Linux servers · nothing to install"), W / 2, L.f1, { size: 30, color: "rgba(255,255,255,0.72)", align: "center" });
      text(c, "NEP · GPUMD · VASP · LAMMPS", W / 2, L.f2, { size: 30, color: "rgba(255,255,255,0.72)", align: "center" });
      text(c, "github.com/zhyan0603/ServerIsland", W / 2, L.f3, { size: 28, weight: 600, color: COL.mint, align: "center", font: MONO });
      text(c, "GPL-3.0 · macOS 14+", W / 2, L.f3 + 44, { size: 24, color: "rgba(255,255,255,0.5)", align: "center" });
    } else {
      text(c, T("Slurm / 直连服务器 · NEP / GPUMD / VASP / LAMMPS · 服务器上什么都不用装", "Slurm & Linux servers · NEP / GPUMD / VASP / LAMMPS · nothing to install on the server"), W / 2, L.f1, { size: 24, color: "rgba(255,255,255,0.7)", align: "center" });
      text(c, "github.com/zhyan0603/ServerIsland  ·  GPL-3.0  ·  macOS 14+", W / 2, L.f2, { size: 22, color: "rgba(255,255,255,0.55)", align: "center" });
    }
    c.restore();
    burst(c, B, 96, W / 2, L.logo, { n: 60, speed: 520, size: 9, grav: 200, seed: 96, dur: 2.2 });
    flash(c, B, 96, 0.5, "91,230,181", 0.25);
  }
  flash(c, B, 80, 0.4, "255,255,255", 0.5);
  if (B > 98.4) { c.fillStyle = `rgba(0,0,0,${prog(B, 98.4, 100)})`; c.fillRect(0, 0, W, H); }
}

// =====================================================================================
const SCENES = { intro: sceneIntro, notch: sceneNotch, expand: sceneExpand, slurm: sceneSlurm, nep: sceneNep, alerts: sceneAlerts, montage: sceneMontage, outro: sceneOutro };
// 交叉淡化的场景切换（硬切点除外：有 impact 的位置直接切 + 闪白）
const XFADE = { expand: 0, slurm: 0, nep: 0.5, alerts: 0.4 };
const off = document.createElement("canvas"); off.width = W; off.height = H;
const offCtx = off.getContext("2d");

function renderFrame(t) {
  const B = t / BEAT;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const idx = TL.scenes.findIndex(s => B >= s.from && B < s.to);
  const sc = TL.scenes[idx < 0 ? TL.scenes.length - 1 : idx];
  const xf = XFADE[sc.id] || 0;
  if (xf > 0 && B < sc.from + xf && idx > 0) {
    // 交叉淡化：新场景先画到离屏画布，再整体按透明度叠上来（场景内部怎么设透明度都不会影响过渡）
    const prev = TL.scenes[idx - 1];
    SCENES[prev.id](ctx, B);
    offCtx.setTransform(1, 0, 0, 1, 0, 0); offCtx.globalAlpha = 1;
    offCtx.clearRect(0, 0, W, H);
    SCENES[sc.id](offCtx, B);
    ctx.save(); ctx.globalAlpha = easeInOutCubic((B - sc.from) / xf);
    ctx.drawImage(off, 0, 0); ctx.restore();
  } else {
    SCENES[sc.id](ctx, B);
  }
  drawCaption(ctx, B);
  // 胶片暗角
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.55, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

window.ready = (async () => {
  await document.fonts.ready;
  if (!LOGO.complete) await new Promise(r => { LOGO.onload = r; LOGO.onerror = r; });
  buildWallpaper();
  renderFrame(0);
})();
window.renderFrame = renderFrame;

// 预览模式：?play 用浏览器实时播放（带音乐）
if (location.search.includes("play")) {
  document.body.classList.add("preview");
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); document.getElementById("stage").style.transform = `scale(${s})`; };
  fit(); addEventListener("resize", fit);
  const audio = new Audio("out/music.wav");
  const hint = document.createElement("div"); hint.id = "hint"; hint.textContent = "点击播放 / 暂停 · 方向键 ←→ 跳 2 秒"; document.body.appendChild(hint);
  let playing = false;
  addEventListener("click", () => { playing = !playing; playing ? audio.play() : audio.pause(); });
  addEventListener("keydown", e => { if (e.key === "ArrowRight") audio.currentTime += 2; if (e.key === "ArrowLeft") audio.currentTime -= 2; });
  window.ready.then(() => { const loop = () => { renderFrame(audio.currentTime); requestAnimationFrame(loop); }; loop(); });
}
